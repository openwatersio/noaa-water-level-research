name: Offline checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - run: python -B -m unittest discover -s tools/etss -p 'test_*.py'
      - run: python -B -m unittest discover -s tests
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: node --test watchdog/*.test.mjs
      - run: npm ci
        working-directory: watchdog
      - run: npm run test:runtime
        working-directory: watchdog
