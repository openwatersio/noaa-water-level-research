name: Ubuntu acquisition-only validation

on:
  pull_request:
    paths: [".github/workflows/ubuntu-acquisition.yml"]

permissions:
  contents: read

jobs:
  acquisition:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Exercise the production finite collector without archive publication
        run: python -B tools/etss/collect.py --output "$RUNNER_TEMP/acquisition" --timeout 30
      - name: Report acquisition states and verify captured body hashes
        if: always()
        run: |
          python -B - "$RUNNER_TEMP/acquisition" <<'PYTHON'
          import hashlib
          import json
          import sys
          from pathlib import Path
          root = Path(sys.argv[1])
          ticks = [p for p in (root / "ticks").glob("*.json") if not p.name.endswith("-start.json")]
          assert len(ticks) == 1
          tick = json.loads(ticks[0].read_text())
          print(json.dumps({k: tick[k] for k in ("startedAt", "finishedAt", "state", "exitCode", "observations", "forecasts")}, indent=2))
          bodies = list(root.rglob("bodies/*.bin"))
          for body in bodies:
              assert hashlib.sha256(body.read_bytes()).hexdigest() == body.stem, body
          print(f"Verified {len(bodies)} unique captured body hashes; receipts remain temporary")
          PYTHON
      - name: Verify no repository state changed
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=normal)"
