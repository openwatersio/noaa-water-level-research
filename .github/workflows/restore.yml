name: Verify public archive replay
on:
  workflow_dispatch:
    inputs:
      data_sha:
        type: string
        required: true
        description: Full data-branch commit to restore and verify
permissions:
  contents: read
jobs:
  restore:
    if: github.repository == 'openwatersio/noaa-water-level-research'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      DATA_SHA: ${{ inputs.data_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download and verify every original byte
        run: python -B -m pipeline --work "$RUNNER_TEMP/noaa" restore --data-sha "$DATA_SHA" --output "$RUNNER_TEMP/restored"
      - name: Reproduce the pinned development reference
        run: python -B -m pipeline.replay --root "$RUNNER_TEMP/restored"
